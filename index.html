<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Book Reader</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('br.settings') || '{}');
      var t = s.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="progress"><div id="progress-bar"></div></div>

  <header id="toolbar">
    <button id="open-btn" class="icon-btn" aria-label="Open PDF" title="Open PDF">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6l2 2h8v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg>
    </button>
    <div id="title" class="title">Book Reader</div>
    <button id="zoom-out" class="icon-btn text-btn" aria-label="Smaller text" title="Smaller">A&minus;</button>
    <button id="zoom-in" class="icon-btn text-btn" aria-label="Larger text" title="Larger">A+</button>
    <button id="theme-btn" class="icon-btn" aria-label="Toggle dark mode" title="Light / dark">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
    <button id="toc-btn" class="icon-btn" aria-label="Contents" title="Contents" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
    </button>
    <button id="settings-btn" class="icon-btn" aria-label="Reading settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    </button>
  </header>

  <main id="main">
    <section id="welcome">
      <label id="dropzone" for="file-input">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
        <strong>Open a PDF</strong>
        <span>Tap to choose a file, or drop one here.<br>Your file stays on this device, nothing gets uploaded.</span>
      </label>
    </section>

    <div id="status" hidden></div>

    <!-- Reflowed text: one continuous column -->
    <article id="reader" hidden></article>

    <!-- Original page images, stacked with no gaps -->
    <div id="pages" hidden></div>
  </main>

  <div id="page-indicator" hidden></div>

  <button id="back-btn" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
    Back
  </button>

  <div id="sheet-backdrop" hidden></div>
  <section id="toc" class="sheet" hidden aria-label="Contents">
    <div class="sheet-handle"></div>
    <h2>Contents</h2>
    <nav id="toc-list"></nav>
  </section>
  <section id="sheet" class="sheet" hidden aria-label="Reading settings">
    <div class="sheet-handle"></div>

    <div class="row">
      <span class="label">View</span>
      <div class="segmented" data-setting="mode">
        <button data-value="text">Text</button>
        <button data-value="pages">Original</button>
      </div>
    </div>

    <div class="row">
      <span class="label">Theme</span>
      <div class="segmented" data-setting="theme">
        <button data-value="light">Light</button>
        <button data-value="sepia">Sepia</button>
        <button data-value="dark">Dark</button>
      </div>
    </div>

    <div class="row text-only">
      <span class="label">Font</span>
      <div class="segmented" data-setting="font">
        <button data-value="serif">Serif</button>
        <button data-value="sans">Sans</button>
      </div>
    </div>

    <div class="row">
      <span class="label">Size</span>
      <input id="size-range" type="range" min="0" max="100" step="1">
      <span id="size-value" class="value"></span>
    </div>

    <div class="row text-only">
      <span class="label">Spacing</span>
      <input id="spacing-range" type="range" min="1.2" max="2.2" step="0.1">
      <span id="spacing-value" class="value"></span>
    </div>

    <p class="hint">Tip: pinch with two fingers to zoom.</p>
  </section>

  <input id="file-input" type="file" accept="application/pdf,.pdf" hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
